<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="100%" stop-color="#05090e"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.3"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Radial Background Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#centerGlow)"/>

  <!-- AI Neural Lines (Knowledge Network) -->
  <g stroke="#34d399" stroke-width="1.8" stroke-opacity="0.4">
    <line x1="206" y1="340" x2="226" y2="300"/>
    <line x1="306" y1="340" x2="286" y2="300"/>
    <line x1="226" y1="300" x2="241" y2="260"/>
    <line x1="286" y1="300" x2="271" y2="260"/>
    <line x1="241" y1="260" x2="256" y2="230"/>
    <line x1="271" y1="260" x2="256" y2="230"/>
    <line x1="226" y1="300" x2="286" y2="300"/>
    <line x1="241" y1="260" x2="271" y2="260"/>
  </g>

  <!-- AI Neural Nodes -->
  <g fill="#34d399" stroke="#ffffff" stroke-width="1.5">
    <circle cx="206" cy="340" r="4.5"/>
    <circle cx="306" cy="340" r="4.5"/>
    <circle cx="226" cy="300" r="5"/>
    <circle cx="286" cy="300" r="5"/>
    <circle cx="241" cy="260" r="5.5"/>
    <circle cx="271" cy="260" r="5.5"/>
    <circle cx="256" cy="230" r="6" fill="#fbbf24"/>
  </g>

  <!-- Twin Minarets -->
  <g stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="380" x2="150" y2="200"/>
    <line x1="362" y1="380" x2="362" y2="200"/>
  </g>
  <g fill="url(#goldGrad)">
    <!-- Left Minaret Finial & Balcony -->
    <rect x="140" y="196" width="20" height="4" rx="2"/>
    <polygon points="144,196 156,196 150,180"/>
    <circle cx="150" cy="176" r="3"/>
    
    <!-- Right Minaret Finial & Balcony -->
    <rect x="352" y="196" width="20" height="4" rx="2"/>
    <polygon points="356,196 368,196 362,180"/>
    <circle cx="362" cy="176" r="3"/>
  </g>

  <!-- Outer Grand Islamic Horseshoe Arch (Mihrab) -->
  <path d="M 175 380 L 175 280 C 175 220 220 180 256 160 C 292 180 337 220 337 280 L 337 380" 
        fill="none" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>

  <!-- Inner Sacred Arch -->
  <path d="M 205 380 L 205 310 C 205 270 230 240 256 220 C 282 240 307 270 307 310 L 307 380" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Golden Crescent Moon -->
  <path d="M 256 142 A 46 46 0 1 0 292 108 A 38 38 0 1 1 256 142 Z" fill="url(#goldGrad)"/>

  <!-- 8-Pointed Islamic Star (Rub el Hizb) inside Crescent -->
  <g transform="translate(268, 114)">
    <rect x="-8" y="-8" width="16" height="16" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="0.8" rx="1.5"/>
    <rect x="-8" y="-8" width="16" height="16" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="0.8" rx="1.5" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Base Trim -->
  <line x1="120" y1="380" x2="392" y2="380" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="390" x2="362" y2="390" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Arabic Typography / Monogram (Noor) -->
  <text x="256" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="4" text-anchor="middle">NOOR AI</text>
  <text x="256" y="456" font-family="'Amiri', serif" font-size="16" fill="#34d399" text-anchor="middle" opacity="0.9">نُورُ الإِسْلَام</text>
</svg>
